name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive the Windows portable build
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: ziyouzhe-windows-portable
          path: release-v*/自由者-*.exe
          if-no-files-found: error
      - name: Prepare release asset
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        shell: pwsh
        run: |
          $version = '${{ inputs.release_tag }}'.TrimStart('v')
          $source = Get-ChildItem -Path 'release-v*/自由者-*.exe' | Select-Object -First 1
          if (-not $source) { throw 'Windows portable build was not found' }
          Copy-Item -LiteralPath $source.FullName -Destination "ziyouzhe-$version.exe"
      - name: Attach Windows build to release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: ziyouzhe-*.exe
          fail_on_unmatched_files: true
